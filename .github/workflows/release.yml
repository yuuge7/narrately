name: Release

# Every push to main publishes a new signed APK as a GitHub Release named "<APP_NAME> vX.Y".
# The version is bumped automatically so a release is never overwritten:
#   - The minor number goes up by one on every release (v1.0 -> v1.1 -> v1.2 ...).
#   - To bump the major number, set `version: 2.0.0+N` in pubspec.yaml and push; the next release is v2.0.
#   - The build number (Android versionCode) always increases by one.
# The bumped pubspec.yaml is committed back to main by github-actions[bot], so run `git pull --rebase` before pushing again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Releases run one at a time, in order, so two pushes can never compute the same version.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_NAME: Narrately
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '21'

jobs:
  version:
    name: Compute next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.next.outputs.skip }}
      version: ${{ steps.next.outputs.version }}
      build: ${{ steps.next.outputs.build }}
      base_sha: ${{ steps.next.outputs.base_sha }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          existing=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            echo "::notice::main ($base_sha) is already released as $existing. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          pub_line=$(grep -E '^version:' pubspec.yaml)
          if [[ ! $pub_line =~ ^version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+) ]]; then
            echo "::error::pubspec.yaml version must look like X.Y.Z+N (found: '$pub_line')"
            exit 1
          fi
          pub_major=${BASH_REMATCH[1]}
          pub_minor=${BASH_REMATCH[2]}
          pub_build=${BASH_REMATCH[4]}

          latest_tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+$' | head -n1 || true)

          if [ -z "$latest_tag" ]; then
            # First release: publish the version currently in pubspec.yaml.
            major=$pub_major
            minor=$pub_minor
            build=$pub_build
          else
            [[ $latest_tag =~ ^v([0-9]+)\.([0-9]+)$ ]]
            tag_major=${BASH_REMATCH[1]}
            tag_minor=${BASH_REMATCH[2]}

            tag_build=0
            tag_pub_line=$(git show "$latest_tag:pubspec.yaml" | grep -E '^version:' || true)
            if [[ $tag_pub_line =~ \+([0-9]+) ]]; then
              tag_build=${BASH_REMATCH[1]}
            fi

            if (( pub_major > tag_major || (pub_major == tag_major && pub_minor > tag_minor) )); then
              # pubspec.yaml was bumped by hand (e.g. to 2.0.0) - honour it.
              major=$pub_major
              minor=$pub_minor
            else
              major=$tag_major
              minor=$((tag_minor + 1))
            fi
            build=$(( (pub_build > tag_build ? pub_build : tag_build) + 1 ))
          fi

          version="$major.$minor"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists. Refusing to overwrite an existing release."
            exit 1
          fi

          echo "Latest release: ${latest_tag:-none}  ->  next: v$version (build $build)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
      BASE_SHA: ${{ needs.version.outputs.base_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.base_sha }}
          fetch-depth: 0

      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bump version in pubspec.yaml
        shell: bash
        run: |
          sed -i -E "s/^version:.*/version: ${VERSION}.0+${BUILD_NUMBER}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$keystore"
          } > key.properties

      - name: Build release APK
        run: flutter build apk --release --build-name="${{ env.VERSION }}.0" --build-number="${{ env.BUILD_NUMBER }}"

      - name: Verify APK is release-signed
        shell: bash
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs" | grep -E 'certificate (DN|SHA-256)'
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is signed with the debug key. Check the signing secrets."
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APP_NAME}-v${VERSION}.apk"

      - name: Commit version bump and tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            echo "::notice::main moved while this build ran. The queued run for the newer commit will publish the release."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --quiet -- pubspec.yaml; then
            git add pubspec.yaml
            git commit -m "chore(release): ${APP_NAME} v${VERSION} [skip ci]"
          fi
          git tag -a "v${VERSION}" -m "${APP_NAME} v${VERSION}"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${VERSION}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "dist/${APP_NAME}-v${VERSION}.apk" \
            --title "${APP_NAME} v${VERSION}" \
            --generate-notes \
            --verify-tag

      - name: Clean up signing files
        if: always()
        shell: bash
        run: rm -f key.properties "$RUNNER_TEMP/release.jks"
